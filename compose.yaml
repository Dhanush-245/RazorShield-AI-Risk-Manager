services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - razorshield_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: razorshield
      POSTGRES_USER: razorshield
      POSTGRES_PASSWORD: razorshield
    ports:
      - "5432:5432"
    volumes:
      - razorshield_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorshield -d razorshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RAZORSHIELD_ENVIRONMENT: development
      RAZORSHIELD_DATABASE_URL: postgresql+psycopg://razorshield:razorshield@postgres:5432/razorshield
      RAZORSHIELD_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      RAZORSHIELD_MODEL_DIR: /app/ml/artifacts
      RAZORSHIELD_RATE_LIMIT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    # The inherited workspace lockfile retains Linux x64 native dependencies.
    platform: linux/amd64
    build:
      context: .
      dockerfile: artifacts/razorshield-ai/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  razorshield_postgres:
  razorshield_redis:
