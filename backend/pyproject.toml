[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "razorshield-api"
version = "0.1.0"
description = "Defense-only merchant risk API for RazorShield AI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "networkx>=3.5,<4",
  "numpy>=2.2,<3",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-json-logger>=3.3,<4",
  "redis>=6,<9",
  "xgboost>=3.0,<4",
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.7,<2",
  "shap>=0.52,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
