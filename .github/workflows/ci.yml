name: RazorShield CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: razorshield_ci
          POSTGRES_USER: razorshield
          POSTGRES_PASSWORD: razorshield-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U razorshield -d razorshield_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Create the shared backend and browser-test environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e './backend[dev]'
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff format --check backend ml
      - run: ruff check backend ml
      - name: Verify SQLite database migrations
        working-directory: backend
        env:
          RAZORSHIELD_DATABASE_URL: sqlite:////tmp/razorshield-ci.db
        run: alembic upgrade head
      - name: Verify PostgreSQL database migrations
        working-directory: backend
        env:
          RAZORSHIELD_DATABASE_URL: postgresql+psycopg://razorshield:razorshield-ci@127.0.0.1:5432/razorshield_ci
        run: alembic upgrade head
      - name: Run backend and ML tests from the repository root
        run: python -m pytest backend/tests ml/tests
      - name: Regression-test PostgreSQL enum migration lifecycle
        env:
          RAZORSHIELD_POSTGRES_TEST_URL: postgresql+psycopg://razorshield:razorshield-ci@127.0.0.1:5432/razorshield_ci
        run: python -m pytest backend/tests/test_postgresql_migrations.py
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit --skip-editable
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm run typecheck:libs && pnpm --filter @workspace/razorshield-ai typecheck
      - run: pnpm --filter @workspace/razorshield-ai build
      - name: Install Chromium for browser E2E
        run: pnpm --filter @workspace/razorshield-ai exec playwright install chromium --with-deps
      - name: Run browser end-to-end flow
        run: pnpm --filter @workspace/razorshield-ai e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: artifacts/razorshield-ai/playwright-report/
          retention-days: 14
      - run: docker compose config --quiet
      - run: docker build -f backend/Dockerfile .
      - run: docker build -f artifacts/razorshield-ai/Dockerfile .
